<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>studentslaptop.com</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#ffffff;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
color:#0d6efd;
}

nav a{
text-decoration:none;
margin-left:20px;
color:#333;
font-weight:bold;
}

.hero{
padding:80px 20px;
text-align:center;
background:#ffffff;
}

.hero h1{
font-size:50px;
color:#222;
}

.hero p{
margin-top:15px;
font-size:20px;
color:#666;
}

.btn{
margin-top:25px;
display:inline-block;
padding:15px 35px;
background:#0d6efd;
color:white;
text-decoration:none;
border-radius:8px;
font-size:18px;
}

.products{
padding:50px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
margin:15px 0;
}

.price{
font-size:22px;
color:#0d6efd;
font-weight:bold;
}

footer{
background:#111;
color:white;
padding:20px;
text-align:center;
margin-top:40px;
}
</style>
</head>

<body>

<header>
<div class="logo">studentslaptop.com</div>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">About</a>
<a href="#">Contact</a>
<a href="#">Cart 🛒</a>
</nav>
</header>

<section class="hero">
<h1>Affordable Laptops For Every Student</h1>

<p>Best Deals on New & Refurbished Laptops</p>

<a class="btn" href="#">Shop Now</a>

</section>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/300x180">
<h3>HP Laptop</h3>
<p class="price">₹499</p>
<a class="btn" href="#">Buy Now</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x180">
<h3>Dell Laptop</h3>
<p class="price">₹499</p>
<a class="btn" href="#">Buy Now</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x180">
<h3>Lenovo Laptop</h3>
<p class="price">₹499</p>
<a class="btn" href="#">Buy Now</a>
</div>

</section>

<footer>

© 2026 studentslaptop.com | All Rights Reserved

</footer>

</body>
</html>
